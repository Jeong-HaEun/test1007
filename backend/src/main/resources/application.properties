spring.application.name=backend

# Render 는 PORT 환경변수로 포트를 알려준다. 로컬은 8080
server.port=${PORT:8080}

# 로컬에서는 backend/.env 파일의 값을 읽는다. (배포 환경에는 파일이 없으므로 optional)
spring.config.import=optional:file:.env[.properties]

# DB 접속 정보는 환경변수로만 받는다.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
# Aiven 무료 플랜은 동시 연결 수가 적어 연결 풀을 작게 쓴다
spring.datasource.hikari.maximum-pool-size=5

# 시작할 때 schema.sql 로 테이블을 만든다. (이미 있으면 그대로 둔다)
spring.sql.init.mode=always
# 엔티티와 테이블 구조가 다르면 시작 시 오류로 알려준다.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

# 프론트엔드 주소만 API 호출을 허용한다. (여러 개면 쉼표로 구분)
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}
